<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區工具性日常生活技能 (IADL) 與功能性認知互動訓練系統</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-back-menu {
            background-color: #607D8B;
            color: white;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .menu-title { font-size: 22px; color: #2c3e50; margin-bottom: 6px; font-weight: bold; }
        .menu-subtitle { font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
        
        .menu-btn-container { display: flex; flex-direction: column; gap: 14px; }
        .menu-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 16px 18px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.3);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn-m2 {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            box-shadow: 0 6px 12px rgba(255, 152, 0, 0.3);
        }

        .filter-container { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; }
        select { padding: 8px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; outline: none; }
        
        .image-container {
            width: 180px; height: 180px; margin: 0 auto 10px; border-radius: 15px;
            background-color: #eee; display: flex; align-items: center; justify-content: center;
            font-size: 70px; object-fit: cover; border: 2px solid #e0e0e0;
        }
        
        .hint-box {
            min-height: 40px; margin: 10px 0; padding: 10px; background-color: #eef7ff;
            border-radius: 10px; color: #0056b3; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .heard-box {
            font-size: 14px; color: #d32f2f; background-color: #ffebee;
            padding: 6px; border-radius: 8px; margin-bottom: 12px; min-height: 22px; word-break: break-all;
        }
        
        button { border: none; padding: 10px 16px; font-size: 15px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        .btn-primary { background-color: #4CAF50; color: white; width: 100%; font-size: 17px; padding: 12px; }
        .btn-hint { background-color: #2196F3; color: white; }
        .btn-manual { background-color: #9C27B0; color: white; }
        .btn-next { background-color: #ff9800; color: white; }
        
        .status { margin-top: 10px; font-size: 12px; color: #666; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; max-width: 350px; text-align: left; }
        .modal-content input { width: 100%; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }

        /* Module 2 Styles */
        .m2-badge { background-color: #e3f2fd; color: #1565c0; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .m2-task-box { background: #fff8e1; border: 1px solid #ffe082; color: #8c6d1f; padding: 10px; border-radius: 12px; font-size: 14px; text-align: left; margin-bottom: 10px; line-height: 1.4; }
        
        .photo-map-container { position: relative; width: 100%; max-width: 380px; margin: 0 auto 10px; border-radius: 12px; overflow: hidden; border: 2px solid #ddd; }
        .photo-map-img { width: 100%; height: auto; display: block; }
        .hotspot { position: absolute; cursor: pointer; border: 2px dashed rgba(255,255,255,0.4); border-radius: 8px; background: rgba(255,255,255,0.05); }

        .m2-sentence-box { min-height: 45px; background: #f5f5f5; border: 2px dashed #bdbdbd; border-radius: 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; padding: 6px; font-size: 17px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .m2-blocks-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .m2-word-block { background: #2196F3; color: white; border-radius: 8px; padding: 8px 12px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; }
        
        .m2-vendor-say { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 10px; font-size: 15px; font-weight: bold; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .m2-pay-board { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 8px; margin-bottom: 10px; }
        .m2-coins-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
        
        .hk-coin { display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.2); user-select: none; }
        .coin-hk10 { width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle, #f3d068 0%, #d4af37 50%, #dcdcdc 53%, #b0b0b0 100%); border: 2px solid #888; color: #333; font-size: 16px; }
        .coin-hk5 { width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle, #ffffff 0%, #e0e0e0 70%, #999 100%); border: 4px solid #b0b0b0; color: #222; font-size: 16px; }
        .coin-hk2 { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle, #ffffff 0%, #e8e8e8 70%, #aaa 100%); border: 3px dashed #888; color: #222; font-size: 15px; }
        .coin-hk1 { width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle, #ffffff 0%, #f0f0f0 70%, #bbb 100%); border: 2px solid #aaa; color: #222; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">

    <!-- ==================== 主選單介面 ==================== -->
    <div id="mainMenuView">
        <div style="background-color: #e8f5e9; color: #2e7d32; padding: 6px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 10px; border: 1px solid #c8e6c9;">
            🧠 職業治療 (OT) 功能性認知與 IADL 訓練
        </div>

        <div class="menu-title">社區生活技能復康</div>
        <div class="menu-subtitle">請選擇臨床訓練模組</div>

        <div class="menu-btn-container">
            <button class="menu-btn" onclick="startModule1()">
                <span style="font-size: 28px;">🧩</span>
                <div>
                    <div>模組一：物品語意與尋詞訓練</div>
                    <div style="font-size: 11px; opacity: 0.85; font-weight: normal; margin-top: 2px;">生活用品命名、語意提示、語音辨識</div>
                </div>
            </button>

            <button class="menu-btn menu-btn-m2" onclick="showM2LevelSelect()">
                <span style="font-size: 28px;">🛒</span>
                <div>
                    <div>模組二：街市買餸實戰 (IADL)</div>
                    <div style="font-size: 11px; opacity: 0.85; font-weight: normal; margin-top: 2px;">煲湯任務：記憶食譜、尋詞、社交往來、付款</div>
                </div>
            </button>

            <button class="btn-back-menu" style="background-color: #009688; width: 100%; margin-top: 5px; padding: 10px;" onclick="openStatsModal()">📊 臨床數據與評估紀錄</button>
        </div>
    </div>

    <!-- ==================== 模組二：難度選擇介面 ==================== -->
    <div id="m2LevelSelectView" style="display: none;">
        <div class="top-nav">
            <button class="btn-back-menu" onclick="showMainMenu()">🏠 返回主選單</button>
            <span style="font-size: 13px; color: #777; font-weight: bold;">買餸實戰 - 難度分級</span>
        </div>

        <h3 style="margin: 10px 0;">請選擇訓練難度 (Grading)</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;">根據患者的認知與工作記憶狀況進行分級：</p>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            <button style="background: #4CAF50; color: white; text-align: left; padding: 12px; border-radius: 12px; border: none; cursor: pointer;" onclick="launchM2(1)">
                <div style="font-size: 16px; font-weight: bold;">🟢 初級 (無干擾)</div>
                <div style="font-size: 12px; opacity: 0.9;">食譜記憶 → 菜檔尋詞 → 肉檔表達 → 付款</div>
            </button>

            <button style="background: #2196F3; color: white; text-align: left; padding: 12px; border-radius: 12px; border: none; cursor: pointer;" onclick="launchM2(2)">
                <div style="font-size: 16px; font-weight: bold;">🔵 中級 (社交干擾)</div>
                <div style="font-size: 12px; opacity: 0.9;">加入「街坊打招呼」社交對話干擾，測試延遲回憶</div>
            </button>

            <button style="background: #FF9800; color: white; text-align: left; padding: 12px; border-radius: 12px; border: none; cursor: pointer;" onclick="launchM2(3)">
                <div style="font-size: 16px; font-weight: bold;">🟠 高級 (干擾 + 情境解難)</div>
                <div style="font-size: 12px; opacity: 0.9;">社交干擾 + 缺貨解難 (如：番茄售罄的應變處置)</div>
            </button>
        </div>
    </div>

    <!-- ==================== 模組一：基礎尋詞練習 ==================== -->
    <div id="module1View" style="display: none;">
        <div class="top-nav">
            <button class="btn-back-menu" onclick="showMainMenu()">🏠 返回主選單</button>
            <span style="font-size: 13px; color: #777; font-weight: bold;">模組一：尋詞訓練</span>
        </div>

        <div class="filter-container">
            <select id="categorySelect" onchange="filterQuestions()">
                <option value="all">所有類別</option>
                <option value="custom">📷 自訂照片</option>
                <option value="food">飲食水果</option>
                <option value="daily">生活用品</option>
            </select>
            <select id="difficultySelect" onchange="filterQuestions()">
                <option value="all">所有難度</option>
                <option value="1">簡單</option>
                <option value="2">中等</option>
            </select>
        </div>

        <h2 style="margin: 5px 0 10px; font-size: 18px;">呢個係咩嚟？請講出嚟</h2>
        
        <div id="imageDisplayArea">
            <img id="displayImage" class="image-container" src="" alt="訓練圖片" style="display:none;">
            <div id="displayEmoji" class="image-container">🪥</div>
        </div>

        <div class="hint-box" id="hintBox">按「開始講嘢」講出名稱</div>
        <div class="heard-box" id="heardBox">聽到的聲音會顯示喺度...</div>
        
        <button class="btn-primary" id="micBtn" onclick="toggleListening()">🎤 開始講嘢</button>
        
        <div style="display: flex; gap: 6px; margin-top: 10px; justify-content: center;">
            <button class="btn-hint" onclick="giveManualHint()">💡 提示</button>
            <button class="btn-manual" onclick="manualPass()">👍 講得啱</button>
            <button class="btn-next" onclick="nextQuestion()">➡️ 下一題</button>
        </div>

        <button style="background-color: #795548; color: white; margin-top: 10px; font-size: 12px; padding: 6px 12px;" onclick="openAddModal()">➕ 新增自訂照片題目</button>
    </div>

    <!-- ==================== 模組二：買餸實戰 View ==================== -->
    <div id="module2View" style="display: none;">
        <div class="top-nav">
            <button class="btn-back-menu" onclick="showMainMenu()">🏠 返回主選單</button>
            <span style="font-size: 13px; color: #777; font-weight: bold;" id="m2DifficultyBadge">買餸實戰</span>
        </div>

        <div id="module2Content"></div>
    </div>

</div>

<!-- 臨床數據 Modal -->
<div class="modal" id="statsModal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: #2c3e50; text-align: center;">📊 臨床 OT 評估數據紀錄</h3>
        
        <div style="background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 14px;">
            <p style="margin: 6px 0;">🎯 <b>完成嘗試次數：</b><span id="statTotal">0</span> 次</p>
            <p style="margin: 6px 0;">✅ <b>正確率 (Accuracy)：</b><span id="statAccuracy" style="color: #2e7d32; font-weight: bold;">0%</span></p>
            <p style="margin: 6px 0;">⏱️ <b>平均處理時間：</b><span id="statAvgTime" style="color: #0056b3; font-weight: bold;">0</span> 秒/項</p>
            <p style="margin: 6px 0;">💡 <b>提示給予 (Cueing)：</b><span id="statHints" style="color: #d32f2f; font-weight: bold;">0</span> 次</p>
        </div>

        <div style="display: flex; gap: 8px;">
            <button style="background-color: #f44336; color: white; flex: 1; font-size: 12px; padding: 8px;" onclick="resetStats()">🗑️ 清除紀錄</button>
            <button style="background-color: #607D8B; color: white; flex: 1; font-size: 12px; padding: 8px;" onclick="closeStatsModal()">關閉</button>
        </div>
    </div>
</div>

<script>
/* ==================== 臨床數據與系統數據 ==================== */
var clinicalData = { totalAttempted: 0, correctCount: 0, hintCount: 0, totalReactionTimeSec: 0, questionStartTime: null };

function startClinicalTimer() { clinicalData.questionStartTime = Date.now(); }
function recordCueing() { clinicalData.hintCount++; }
function recordSuccess() {
    clinicalData.totalAttempted++;
    clinicalData.correctCount++;
    if (clinicalData.questionStartTime) {
        clinicalData.totalReactionTimeSec += (Date.now() - clinicalData.questionStartTime) / 1000;
        clinicalData.questionStartTime = null;
    }
}

function openStatsModal() {
    var accuracy = clinicalData.totalAttempted > 0 ? Math.round((clinicalData.correctCount / clinicalData.totalAttempted) * 100) : 0;
    var avgTime = clinicalData.correctCount > 0 ? (clinicalData.totalReactionTimeSec / clinicalData.correctCount).toFixed(1) : 0;
    document.getElementById('statTotal').innerText = clinicalData.totalAttempted;
    document.getElementById('statAccuracy').innerText = accuracy + "%";
    document.getElementById('statAvgTime').innerText = avgTime;
    document.getElementById('statHints').innerText = clinicalData.hintCount;
    document.getElementById('statsModal').style.display = 'flex';
}
function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }
function resetStats() { clinicalData = { totalAttempted: 0, correctCount: 0, hintCount: 0, totalReactionTimeSec: 0, questionStartTime: null }; openStatsModal(); }

function showMainMenu() {
    document.getElementById('mainMenuView').style.display = 'block';
    document.getElementById('m2LevelSelectView').style.display = 'none';
    document.getElementById('module1View').style.display = 'none';
    document.getElementById('module2View').style.display = 'none';
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function speakCantonese(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }
}

/* ==================== 模組一邏輯 (簡化保持運作) ==================== */
var defaultQuestions = [
    { name: "蘋果", category: "food", level: 1, keywords: ["蘋果"], emoji: "🍎", semantic: "紅色嘅水果，甜甜地", phonemic: "『平』音..." },
    { name: "牙刷", category: "daily", level: 1, keywords: ["牙刷"], emoji: "🪥", semantic: "每日刷牙用嘅工具", phonemic: "『牙』音..." }
];
var activeQuestions = defaultQuestions, currentIndex = 0;
function startModule1() {
    document.getElementById('mainMenuView').style.display = 'none';
    document.getElementById('module1View').style.display = 'block';
    loadQuestion();
}
function loadQuestion() {
    var current = activeQuestions[currentIndex];
    document.getElementById('displayEmoji').innerText = current.emoji;
    document.getElementById('hintBox').innerText = "請講出名稱";
    startClinicalTimer();
}
function giveManualHint() {
    recordCueing();
    var current = activeQuestions[currentIndex];
    document.getElementById('hintBox').innerText = "提示：" + current.semantic;
    speakCantonese(current.semantic);
}
function manualPass() { recordSuccess(); nextQuestion(); }
function nextQuestion() { currentIndex = (currentIndex + 1) % activeQuestions.length; loadQuestion(); }

/* ==================== 模組二：買餸實戰核心邏輯 (Grading) ==================== */
var m2SelectedLevel = 1; // 1: 初級, 2: 中級, 3: 高級
var m2Step = 0;
var m2PaidAmount = 0;
var m2SelectedBlocks = [];

function showM2LevelSelect() {
    document.getElementById('mainMenuView').style.display = 'none';
    document.getElementById('m2LevelSelectView').style.display = 'block';
}

function launchM2(level) {
    m2SelectedLevel = level;
    document.getElementById('m2LevelSelectView').style.display = 'none';
    document.getElementById('module2View').style.display = 'block';
    
    var badge = document.getElementById('m2DifficultyBadge');
    if(level === 1) badge.innerText = "買餸實戰 (初級 - 無干擾)";
    if(level === 2) badge.innerText = "買餸實戰 (中級 - 社交干擾)";
    if(level === 3) badge.innerText = "買餸實戰 (高級 - 解難挑戰)";

    m2Step = 0; // 從 Step 0 (食譜記憶卡) 開始
    renderM2();
}

function renderM2() {
    m2SelectedBlocks = [];
    m2PaidAmount = 0;
    var container = document.getElementById('module2Content');

    // Step 0: 計劃與工作記憶 (Recipe Memory)
    if (m2Step === 0) {
        speakCantonese("今晚想煲番茄薯仔瘦肉湯。請記住要買嘅材料：番茄兩個、薯仔兩個、瘦肉一塊。");
        container.innerHTML = `
            <div class="m2-badge">階段 1：擬定購物任務 (Working Memory)</div>
            <div class="m2-task-box" style="background:#eef7ff; border-color:#90caf9; color:#0d47a1; font-size:16px;">
                🍲 <b>今晚菜單：番茄薯仔瘦肉湯</b><br><br>
                <b>請記住以下購物清單：</b><br>
                1. 🍅 番茄 <b>2 個</b><br>
                2. 🥔 薯仔 <b>2 個</b><br>
                3. 🥩 瘦肉 <b>1 塊</b><br><br>
                💰 預算：<b>$50 港幣</b>
            </div>
            <button class="btn-primary" style="margin-top:15px;" onclick="m2AdvanceFromRecipe()">記住啦，出發去街市！</button>
        `;
    }
    // Step 0.5: 社交干擾 (僅在中級與高級出現)
    else if (m2Step === 0.5) {
        speakCantonese("喺街市路口遇到鄰居陳太太。佢同你打招呼：去買餸啊？今日煲咩湯啊？");
        container.innerHTML = `
            <div class="m2-badge">路遇街坊 (社交干擾)</div>
            <div class="m2-vendor-say" style="background:#fff3e0; color:#e65100; border-color:#ffe0b2;">
                🙋‍♀️ <b>鄰居陳太太：</b>「去買餸啊？今日煲咩湯啊？」
            </div>
            <div style="font-size:14px; font-weight:bold; margin-bottom:10px;">請回答陳太太：</div>
            <div class="m2-blocks-grid">
                <button class="m2-word-block" style="background:#4caf50;" onclick="m2AnswerNeighbor(true)">「係啊，去買嘢煲番茄薯仔湯啊！」</button>
                <button class="m2-word-block" style="background:#9e9e9e;" onclick="m2AnswerNeighbor(false)">「我去買水果啊。」</button>
            </div>
            <div id="m2NeighborFeedback" class="status" style="margin-top:10px; font-size:14px; font-weight:bold;"></div>
        `;
    }
    // Step 1: 菜檔 1 - 視覺搜尋 (番茄)
    else if (m2Step === 1) {
        speakCantonese("嚟到第一間菜檔，請喺相片中點擊揀出番茄。");
        container.innerHTML = `
            <div class="m2-badge">第一關：菜檔1 (視覺搜尋)</div>
            <h3 style="margin:5px 0 10px;">請點擊相片中的「番茄」🍅</h3>
            
            <div class="photo-map-container">
                <img src="market1.jpg" class="photo-map-img" alt="菜檔1">
                <div class="hotspot" style="top: 10%; left: 15%; width: 35%; height: 35%;" onclick="m2SelectSearchItem(true, '番茄')"></div>
                <div class="hotspot" style="top: 35%; left: 32%; width: 30%; height: 50%;" onclick="m2SelectSearchItem(false, '蘆筍')"></div>
                <div class="hotspot" style="top: 50%; left: 62%; width: 35%; height: 40%;" onclick="m2SelectSearchItem(false, '紅蘿蔔')"></div>
            </div>

            <div id="m2Feedback" class="hint-box">請直接點擊相片中的「番茄」</div>
        `;
    }
    // Step 2: 菜檔 1 - 句式表達 (番茄)
    else if (m2Step === 2) {
        // 高級難度：加入缺貨 Problem Solving 干擾
        if (m2SelectedLevel === 3) {
            speakCantonese("菜檔老闆話：番茄得返一個咋喎！你會點講？");
            var blocksProblem = ['唔該', '我要', '一個', '兩個', '都好', '就買一個啦', '番茄'];
            var validProblem = ['就買一個啦', '我要一個', '一個都好'];
            renderSentenceStep("第一關：菜檔1 (應變解難)", blocksProblem, validProblem, "就買一個啦", "⚠️ <b>老闆：</b>「番茄只剩返 1 個咋喎，你原本要 2 個，點算？」");
        } else {
            speakCantonese("請跟伙記講你想買咩。");
            var blocks = ['唔該', '兩', '個', '一', '斤', '我要', '番茄'];
            var valid = ['我要兩個番茄', '唔該我要兩個番茄'];
            renderSentenceStep("第一關：菜檔1 (口語表達)", blocks, valid, "我要兩個番茄", "🗣️ <b>請跟伙記講你需要嘅數量：</b>");
        }
    }
    // Step 3: 菜檔 1 - 付款
    else if (m2Step === 3) {
        var cost = (m2SelectedLevel === 3) ? 6 : 12; // 高級因只買1個，變$6
        speakCantonese("番茄，秤咗呢度" + cost + "蚊。");
        renderPaymentStep("第一關：菜檔1 (金額付款)", cost, "番茄，秤咗呢度 $" + cost + " 蚊。");
    }
    // Step 4: 菜檔 2 - 視覺搜尋 (薯仔)
    else if (m2Step === 4) {
        speakCantonese("嚟到第二間菜檔，請喺相片中點擊揀出薯仔。");
        container.innerHTML = `
            <div class="m2-badge">第二關：菜檔2 (視覺搜尋)</div>
            <h3 style="margin:5px 0 10px;">請點擊相片中的「薯仔」🥔</h3>
            
            <div class="photo-map-container">
                <img src="market2.jpg" class="photo-map-img" alt="菜檔2">
                <div class="hotspot" style="top: 52%; left: 12%; width: 38%; height: 32%;" onclick="m2SelectSearchItem(true, '薯仔')"></div>
                <div class="hotspot" style="top: 60%; left: 52%; width: 35%; height: 30%;" onclick="m2SelectSearchItem(false, '番茄')"></div>
            </div>

            <div id="m2Feedback" class="hint-box">請直接點擊相片中的「薯仔」</div>
        `;
    }
    // Step 5: 菜檔 2 - 句式表達 (薯仔)
    else if (m2Step === 5) {
        speakCantonese("請跟伙記講你想買咩。");
        var blocks = ['唔該', '兩', '個', '一', '斤', '我要', '薯仔'];
        var valid = ['我要兩個薯仔', '唔該我要兩個薯仔'];
        renderSentenceStep("第二關：菜檔2 (口語表達)", blocks, valid, "我要兩個薯仔", "🗣️ <b>請跟伙記講你需要嘅數量：</b>");
    }
    // Step 6: 菜檔 2 - 付款
    else if (m2Step === 6) {
        speakCantonese("兩個薯仔呢度15蚊。");
        renderPaymentStep("第二關：菜檔2 (金額付款)", 15, "兩個薯仔，秤咗呢度 $15 蚊。");
    }
    // Step 7: 肉檔 - 口語需求表達 (無須視覺搜尋，符合真實情境)
    else if (m2Step === 7) {
        speakCantonese("最後嚟到豬肉檔。肉檔通常直接跟老闆講，請拼出你想講嘅話。");
        var blocksMeat = ['唔該', '我要', '一塊', '瘦肉', '兩斤', '排骨'];
        var validMeat = ['我要一塊瘦肉', '唔該我要一塊瘦肉', '一塊瘦肉唔該'];
        renderSentenceStep("第三關：豬肉檔 (口語溝通)", blocksMeat, validMeat, "我要一塊瘦肉", "🥩 <b>嚟到豬肉檔，請直接跟老闆講你要買咩：</b>");
    }
    // Step 8: 肉檔 - 付款
    else if (m2Step === 8) {
        speakCantonese("瘦肉一塊，呢度20蚊。");
        renderPaymentStep("第三關：豬肉檔 (金額付款)", 20, "好，瘦肉一塊，秤咗係 $20 蚊。");
    }
    // Step 9: 完結結算
    else if (m2Step === 9) {
        speakCantonese("恭喜你！成功買齊番茄、薯仔同瘦肉！今晚有美味嘅湯飲啦！");
        container.innerHTML = `
            <div style="font-size: 60px; margin: 10px 0;">🥣</div>
            <h2 style="color: #4CAF50; margin-top:0;">任務完成！煲湯成功！</h2>
            <div class="m2-task-box" style="background:#eef7ff; border-color:#bbdefb; color:#1565c0;">
                <b>🍲 煲湯任務總結：</b><br>
                • 食譜記憶與執行：<b>成功</b><br>
                • 菜檔與肉檔溝通：<b>成功</b><br>
                -----------------------------<br>
                <b>🎉 成功訓練功能性認知與社區生活技能！</b>
            </div>
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-primary" onclick="showM2LevelSelect()">🔄 選擇其他難度重新練習</button>
                <button class="btn-next" style="background-color:#607D8B;" onclick="showMainMenu()">🏠 返回主選單</button>
            </div>
        `;
    }

    if (m2Step > 0 && m2Step < 9) startClinicalTimer();
}

function m2AdvanceFromRecipe() {
    if (m2SelectedLevel >= 2) {
        m2Step = 0.5; // 中級/高級進入干擾
    } else {
        m2Step = 1; // 初級直接去菜檔
    }
    renderM2();
}

function m2AnswerNeighbor(isCorrect) {
    var fb = document.getElementById('m2NeighborFeedback');
    if (isCorrect) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 答對咗！回答得非常好！";
        speakCantonese("陳太太話：咁好啊，拜拜！");
        setTimeout(function() { m2Step = 1; renderM2(); }, 1800);
    } else {
        recordCueing();
        fb.style.color = "#d32f2f";
        fb.innerText = "⚠️ 記得我們今晚係要煲「番茄薯仔湯」喔！再試下！";
        speakCantonese("記得我們今晚係要煲番茄薯仔湯喔");
    }
}

function m2SelectSearchItem(isCorrect, name) {
    var fb = document.getElementById('m2Feedback');
    if (isCorrect) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 答對咗！搵到「" + name + "」啦！";
        speakCantonese("答對咗！搵到" + name + "啦！");
        setTimeout(function() { m2Step++; renderM2(); }, 1500);
    } else {
        fb.style.color = "#d32f2f";
        fb.innerText = "❌ 呢個係「" + name + "」，再搵下啦！";
        speakCantonese("呢個係" + name + "，再試下啦");
    }
}

function renderSentenceStep(stepTitle, blocks, validAnswers, hintText, headerPrompt) {
    var container = document.getElementById('module2Content');
    var blocksHtml = blocks.map(function(b) {
        return `<button class="m2-word-block" onclick="m2AddBlock('${b}')">${b}</button>`;
    }).join('');

    container.innerHTML = `
        <div class="m2-badge">${stepTitle}</div>
        <div style="text-align:left; font-size:14px; margin-bottom:8px;">${headerPrompt}</div>
        
        <div class="m2-sentence-box" id="m2SentenceBox">請點擊積木組句...</div>
        <div class="m2-blocks-grid">${blocksHtml}</div>

        <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button style="background:#2196F3; color:white; flex:1; font-size:13px; padding:8px;" onclick="m2ShowHint('${hintText}')">💡 提示</button>
            <button style="background:#ff9800; color:white; flex:1; font-size:13px; padding:8px;" onclick="m2ClearBlocks()">🗑️ 重設</button>
            <button style="background:#4CAF50; color:white; flex:1.5; font-size:13px; padding:8px;" onclick="m2CheckSentence(${JSON.stringify(validAnswers).replace(/"/g, '&quot;')})">✅ 確認</button>
        </div>
        <div id="m2SentenceFeedback" class="status" style="margin-top:8px; font-size:14px; font-weight:bold;"></div>
    `;
}

function m2ShowHint(hintText) {
    recordCueing();
    document.getElementById('m2SentenceFeedback').style.color = "#0056b3";
    document.getElementById('m2SentenceFeedback').innerText = "💡 提示：可以講「" + hintText + "」";
    speakCantonese("你可以講：" + hintText);
}

function m2AddBlock(word) {
    m2SelectedBlocks.push(word);
    document.getElementById('m2SentenceBox').innerText = m2SelectedBlocks.join(' ');
    speakCantonese(word);
}

function m2ClearBlocks() {
    m2SelectedBlocks = [];
    document.getElementById('m2SentenceBox').innerText = "請點擊積木組句...";
    document.getElementById('m2SentenceFeedback').innerText = "";
}

function m2CheckSentence(validAnswers) {
    var result = m2SelectedBlocks.join('');
    var fb = document.getElementById('m2SentenceFeedback');
    
    if (validAnswers.indexOf(result) !== -1) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 講得好清晰！";
        speakCantonese("講得好棒！");
        setTimeout(function() { m2Step++; renderM2(); }, 1500);
    } else {
        fb.style.color = "#d32f2f";
        fb.innerText = "未啱喎，請再試下組合積木。";
        speakCantonese("未啱喎，再試一下");
    }
}

function renderPaymentStep(stepTitle, targetAmount, vendorSpeech) {
    var container = document.getElementById('module2Content');
    container.innerHTML = `
        <div class="m2-badge">${stepTitle}</div>
        <div class="m2-vendor-say">🗣️ <b>伙計：</b>「${vendorSpeech}」</div>

        <div class="m2-pay-board">
            <div>應付金額：<span style="color:#d32f2f; font-size:22px; font-weight:bold;">$${targetAmount}</span></div>
            <div style="margin-top:4px;">已付金額：<span id="m2PaidText" style="color:#2e7d32; font-size:22px; font-weight:bold;">$0</span></div>
        </div>

        <div style="font-size:13px; font-weight:bold; color:#555;">點擊港幣硬幣付款：</div>
        <div class="m2-coins-row">
            <div class="hk-coin coin-hk10" onclick="m2AddCoin(10, ${targetAmount})">$10</div>
            <div class="hk-coin coin-hk5" onclick="m2AddCoin(5, ${targetAmount})">$5</div>
            <div class="hk-coin coin-hk2" onclick="m2AddCoin(2, ${targetAmount})">$2</div>
            <div class="hk-coin coin-hk1" onclick="m2AddCoin(1, ${targetAmount})">$1</div>
        </div>

        <button style="background:#9e9e9e; color:white; padding:6px 14px; font-size:12px; border-radius:15px;" onclick="m2ResetCoins()">🔄 重新投幣</button>
        <div id="m2PayFeedback" class="status" style="margin-top:8px; font-size:14px; font-weight:bold;"></div>
    `;
}

function m2AddCoin(amount, target) {
    m2PaidAmount += amount;
    document.getElementById('m2PaidText').innerText = "$" + m2PaidAmount;
    speakCantonese(amount + "蚊");

    var fb = document.getElementById('m2PayFeedback');
    if (m2PaidAmount === target) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 啱啱好 $" + target + " 蚊！付款成功！";
        speakCantonese("收你" + target + "蚊，啱啱好！");
        setTimeout(function() { m2Step++; renderM2(); }, 1800);
    } else if (m2PaidAmount > target) {
        fb.style.color = "#d32f2f";
        fb.innerText = "⚠️ 俾多咗錢啦，請重新投幣。";
        speakCantonese("俾多咗錢啦，請重新投幣");
        setTimeout(function() { m2ResetCoins(); }, 1200);
    }
}

function m2ResetCoins() {
    m2PaidAmount = 0;
    var el = document.getElementById('m2PaidText');
    if (el) el.innerText = "$0";
    var fb = document.getElementById('m2PayFeedback');
    if (fb) fb.innerText = "";
}

window.onload = function() { showMainMenu(); };
</script>

</body>
</html>
