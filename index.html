<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakMyMind話在心頭</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
        }

        /* 頂部導航按鈕 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .btn-back-menu {
            background-color: #607D8B;
            color: white;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* 主選單專用樣式 */
        .menu-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .menu-subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .menu-btn-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .menu-btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 18px 20px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.3);
            transition: transform 0.1s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn-m2 {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            box-shadow: 0 6px 12px rgba(255, 152, 0, 0.3);
        }
        .menu-btn:active {
            transform: scale(0.98);
        }

        /* 模組一樣式 */
        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }
        select {
            padding: 8px 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #fff;
            outline: none;
        }
        .image-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 10px;
            border-radius: 15px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            object-fit: cover;
            border: 2px solid #e0e0e0;
        }
        .hint-box {
            min-height: 45px;
            margin: 10px 0;
            padding: 10px;
            background-color: #eef7ff;
            border-radius: 10px;
            color: #0056b3;
            font-size: 17px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .heard-box {
            font-size: 15px;
            color: #d32f2f;
            background-color: #ffebee;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 24px;
            word-break: break-all;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }
        button {
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn-primary { background-color: #4CAF50; color: white; width: 100%; font-size: 18px; padding: 14px; }
        .btn-hint { background-color: #2196F3; color: white; }
        .btn-manual { background-color: #9C27B0; color: white; }
        .btn-next { background-color: #ff9800; color: white; }
        .btn-add { background-color: #795548; color: white; margin-top: 10px; font-size: 14px; padding: 8px 16px; }
        .btn-clear { background-color: #e91e63; color: white; margin-top: 10px; font-size: 12px; padding: 5px 10px; border-radius: 8px; }
        
        button.mic-active {
            background-color: #f44336;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            text-align: left;
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* 模組二 (買餸實戰) 專用 UI 樣式 */
        .m2-badge {
            background-color: #e3f2fd;
            color: #1565c0;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .m2-task-box {
            background: #fff8e1;
            border: 1px solid #ffe082;
            color: #8c6d1f;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* 街坊干擾提示卡 */
        .distraction-card {
            background: #fff3e0;
            border: 2px dashed #ff9800;
            border-radius: 16px;
            padding: 20px 15px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 照片上方提示小字 */
        .photo-hint-small {
            font-size: 13px;
            color: #666;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
        }

        /* 照片熱區點擊地圖容器 */
        .photo-map-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 10px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .photo-map-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .hotspot {
            position: absolute;
            cursor: pointer;
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
        }
        .hotspot:active {
            background: rgba(76, 175, 80, 0.4);
            border-color: #4CAF50;
        }

        /* 積木樣式 */
        .m2-sentence-box {
            min-height: 50px;
            background: #f5f5f5;
            border: 2px dashed #bdbdbd;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .m2-blocks-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .m2-word-block {
            background: #2196F3;
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.16);
            border: none;
        }
        .m2-word-block:active {
            transform: scale(0.95);
            background: #1976D2;
        }

        /* 付款與高仿真港幣紙幣/硬幣樣式 */
        .m2-vendor-say {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #c8e6c9;
        }
        .m2-pay-board {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .m2-coins-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            align-items: center;
        }

        /* 港幣紙幣樣式 */
        .hk-note {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 105px;
            height: 54px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 19px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);

            user-select: none;
            margin: 4px;
        }
        .hk-note:active { transform: scale(0.95); }
        .note-50 { background: linear-gradient(135deg, #e53935, #c2185b); border: 2px solid #b71c1c; } /* $50 紫紅色 */
        .note-20 { background: linear-gradient(135deg, #1e88e5, #1565c0); border: 2px solid #0d47a1; } /* $20 藍色 */
        .note-10 { background: linear-gradient(135deg, #43a047, #2e7d32); border: 2px solid #1b5e20; } /* $10 綠色 */
        
        /* 港幣硬幣真實視覺擬真 */
        .hk-coin {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.8);
            transition: transform 0.1s;
            user-select: none;
        }
        .hk-coin:active { transform: scale(0.92); }
        
        .coin-hk10 {
            width: 68px; height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3d068 0%, #d4af37 50%, #dcdcdc 53%, #b0b0b0 100%);
            border: 2px solid #888;
            color: #333;
            font-size: 18px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }
        .coin-hk5 {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 70%, #999 100%);
            border: 4px solid #b0b0b0;
            color: #222;
            font-size: 18px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }
        .coin-hk2 {
            width: 58px; height: 58px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #e8e8e8 70%, #aaa 100%);
            border: 3px dashed #888;
            color: #222;
            font-size: 16px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }
        .coin-hk1 {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #f0f0f0 70%, #bbb 100%);
            border: 2px solid #aaa;
            color: #222;
            font-size: 15px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }

        .level-card-btn {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .level-card-btn:active {
            border-color: #FF9800;
            background-color: #fff8e1;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ==================== 主選單介面 (MAIN MENU) ==================== -->
    <div id="mainMenuView">
        <div style="background-color: #fff3cd; color: #856404; padding: 6px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 12px; border: 1px solid #ffeeba;">
            ⚠️ DEMO 展示版本 (僅供面試展示)
        </div>

        <div class="menu-title">🧠 SpeakMyMind話在心頭</div>
        <div class="menu-subtitle">請點選下方模組開始進行練習</div>

            <button class="menu-btn" onclick="startModule1()">

    </div>

    <!-- ==================== 模組一：基礎尋詞練習 ==================== -->
    <div id="module1View" style="display: none;">

<!-- 模組一彈出視窗：新增自訂題目 -->

<!-- 臨床數據統計彈出視窗 -->
<div class="modal" id="statsModal">
    <div class="modal-content" style="max-width: 400px;">
        <h3 style="margin-top:0; color: #2c3e50; text-align: center;">📊 臨床練習數據記錄</h3>
        
        <div style="background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 15px;">
            <p style="margin: 6px 0;">🎯 <b>練習總題數：</b><span id="statTotal">0</span> 題</p>
            <p style="margin: 6px 0;">✅ <b>整體正確率：</b><span id="statAccuracy" style="color: #2e7d32; font-weight: bold;">0%</span></p>
            <p style="margin: 6px 0;">⏱️ <b>平均反應時間：</b><span id="statAvgTime" style="color: #0056b3; font-weight: bold;">0</span> 秒/題</p>
            <p style="margin: 6px 0;">💡 <b>Cueing（提示）總次數：</b><span id="statHints" style="color: #d32f2f; font-weight: bold;">0</span> 次</p>
        </div>

        <div style="display: flex; gap: 8px;">
            <button style="background-color: #f44336; color: white; flex: 1; font-size: 13px; padding: 8px;" onclick="resetStats()">🗑️ 重設數據</button>
            <button style="background-color: #607D8B; color: white; flex: 1; font-size: 13px; padding: 8px;" onclick="closeStatsModal()">關閉</button>
        </div>
    </div>
</div>

<script>
/* ==================== 臨床數據追蹤系統 ==================== */
var clinicalData = {
    totalAttempted: 0,
    correctCount: 0,
    hintCount: 0,
    totalReactionTimeSec: 0,
    questionStartTime: null
};

function startClinicalTimer() {
    clinicalData.questionStartTime = Date.now();
}

function recordCueing() {
    clinicalData.hintCount++;
}

function recordSuccess() {
    clinicalData.totalAttempted++;
    clinicalData.correctCount++;
    
    if (clinicalData.questionStartTime) {
        var elapsed = (Date.now() - clinicalData.questionStartTime) / 1000;
        clinicalData.totalReactionTimeSec += elapsed;
        clinicalData.questionStartTime = null;
    }
}

function openStatsModal() {
    var accuracy = clinicalData.totalAttempted > 0 
        ? Math.round((clinicalData.correctCount / clinicalData.totalAttempted) * 100) 
        : 0;
        
    var avgTime = clinicalData.correctCount > 0 
        ? (clinicalData.totalReactionTimeSec / clinicalData.correctCount).toFixed(1) 
        : 0;

    document.getElementById('statTotal').innerText = clinicalData.totalAttempted;
    document.getElementById('statAccuracy').innerText = accuracy + "%";
    document.getElementById('statAvgTime').innerText = avgTime;
    document.getElementById('statHints').innerText = clinicalData.hintCount;

    document.getElementById('statsModal').style.display = 'flex';
}

function closeStatsModal() {
    document.getElementById('statsModal').style.display = 'none';
}

function resetStats() {
    if (confirm("確定要重設本次練習的臨床數據嗎？")) {
        clinicalData = {
            totalAttempted: 0,
            correctCount: 0,
            hintCount: 0,
            totalReactionTimeSec: 0,
            questionStartTime: null
        };
        openStatsModal();
    }
}

/* 街市真實相片資源 */
var marketImg1 = 'market1.jpg';
var marketImg2 = 'market2.jpg';

/* 通用控制邏輯 */
function showMainMenu() {
    document.getElementById('mainMenuView').style.display = 'block';
    document.getElementById('module1View').style.display = 'none';
    document.getElementById('module2View').style.display = 'none';

    if (isListening && recognition) {
        try { recognition.stop(); } catch(e){}
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

function startModule1() {
    document.getElementById('mainMenuView').style.display = 'none';
    document.getElementById('module1View').style.display = 'block';
    document.getElementById('module2View').style.display = 'none';

    loadSavedQuestions();
    filterQuestions();
}

function startModule2() {
    document.getElementById('mainMenuView').style.display = 'none';
    document.getElementById('module1View').style.display = 'none';
    document.getElementById('module2View').style.display = 'block';

    m2Step = 0; // 0 為選擇難度畫面
    renderM2();
}

function speakCantonese(text, onEndCallback) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;
        if (onEndCallback) {
            utterance.onend = function() { onEndCallback(); };
            utterance.onerror = function() { onEndCallback(); };
        }
        window.speechSynthesis.speak(utterance);
    } else {
        if (onEndCallback) onEndCallback();
    }
}

var rawQuestions = [];
var activeQuestions = [];

function loadSavedQuestions() {
    var saved = localStorage.getItem('cantonese_rehab_custom_q');
    var customList = saved ? JSON.parse(saved) : [];
    rawQuestions = customList.concat(defaultQuestions);
}

function filterQuestions() {
    var cat = document.getElementById('categorySelect').value;
    var diff = document.getElementById('difficultySelect').value;

    activeQuestions = rawQuestions.filter(function(q) {
        var matchCat = (cat === 'all' || q.category === cat);
        var matchDiff = (diff === 'all' || q.level.toString() === diff);
        return matchCat && matchDiff;
    });

    if (activeQuestions.length === 0) activeQuestions = rawQuestions;
    currentIndex = 0;
    loadQuestion();
    startClinicalTimer();
}

function loadQuestion() {
    if (activeQuestions.length === 0) return;
    var current = activeQuestions[currentIndex];

    var imgEl = document.getElementById('displayImage');
    var emojiEl = document.getElementById('displayEmoji');

    if (current.image) {
        imgEl.src = current.image;
        imgEl.style.display = 'block';
        emojiEl.style.display = 'none';
    } else {
        emojiEl.innerText = current.emoji || "❓";
        emojiEl.style.display = 'flex';
        imgEl.style.display = 'none';
    }

    document.getElementById('hintBox').innerText = "按「開始講嘢」講出名稱";
    document.getElementById('heardBox').innerText = "聽到的聲音會顯示喺度...";
    document.getElementById('statusText').innerText = "狀態：準備就緒 (廣東話模式)";
    hintLevel = 0;
    hasAnswered = false;
}

function openAddModal() { document.getElementById('addModal').style.display = 'flex'; }
function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

function compressImage(file, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
            var canvas = document.createElement('canvas');
            var max_size = 400;
            var width = img.width;
            var height = img.height;

            if (width > height) {
                if (width > max_size) {
                    height *= max_size / width;
                    width = max_size;
                }
            } else {
                if (height > max_size) {
                    width *= max_size / height;
                    height = max_size;
                }
            }

            canvas.width = width;
            canvas.height = height;

            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            var compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
            callback(compressedDataUrl);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function saveCustomQuestion() {
    var fileInput = document.getElementById('customImageInput');
    var nameInput = document.getElementById('customNameInput').value.trim();
    var semanticInput = document.getElementById('customSemanticInput').value.trim();

    if (!fileInput.files || !fileInput.files[0]) { 
        alert("請選擇照片！"); 
        return; 
    }
    if (!nameInput) { 
        alert("請輸入名稱！"); 
        return; 
    }

    compressImage(fileInput.files[0], function(compressedBase64) {
        var newQuestion = {
            name: nameInput,
            category: "custom",
            level: 1,
            keywords: [nameInput],
            image: compressedBase64,
            semantic: semanticInput || ("呢個係" + nameInput),
            phonemic: "第一個字係『" + nameInput.charAt(0) + "』..."
        };

        var saved = localStorage.getItem('cantonese_rehab_custom_q');
        var customList = saved ? JSON.parse(saved) : [];
        customList.unshift(newQuestion);
        
        try {
            localStorage.setItem('cantonese_rehab_custom_q', JSON.stringify(customList));
        } catch (err) {
            alert("儲存空間已滿，請刪除部分舊相片再試。");
            return;
        }

        loadSavedQuestions();
        document.getElementById('categorySelect').value = 'custom';
        filterQuestions();
        closeAddModal();

        document.getElementById('customNameInput').value = '';
        document.getElementById('customSemanticInput').value = '';
        fileInput.value = '';
    });
}

function clearCustomQuestions() {
    if (confirm("確定要刪除所有上傳過的照片題目嗎？")) {
        localStorage.removeItem('cantonese_rehab_custom_q');
        loadSavedQuestions();
        document.getElementById('categorySelect').value = 'all';
        filterQuestions();
    }
}

function initSpeechRecognition() {
    if (!SpeechRecognition) {
        document.getElementById('statusText').innerText = "⚠️ 瀏覽器不支援語音辨識（建議使用 Chrome/Safari）";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = function() {
        isListening = true;
        hasAnswered = false;
        document.getElementById('micBtn').classList.add('mic-active');
        document.getElementById('micBtn').innerText = "🎙️ 聽緊你講嘢...";
        document.getElementById('statusText').innerText = "請講出圖中物品嘅廣東話名稱";
        document.getElementById('heardBox').innerText = "聽緊...";
    };

    recognition.onresult = function(event) {
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
        }
        var cleanText = transcript.replace(/[.,!?。，！？\s]/g, '');
        document.getElementById('heardBox').innerText = "聽到的內容：「" + cleanText + "」";

        if (!hasAnswered && cleanText.length > 0) checkAnswer(cleanText);
    };

    recognition.onerror = function(event) {
        if (event.error !== 'no-speech') {
            document.getElementById('statusText').innerText = "收音不清晰，家屬可按「講得啱」過關";
        }
        stopListeningState();
    };

    recognition.onend = function() { stopListeningState(); };
}

function stopListeningState() {
    isListening = false;
    var btn = document.getElementById('micBtn');
    if (btn) {
        btn.classList.remove('mic-active');
        btn.innerText = "🎤 開始講嘢";
    }
}

function toggleListening() {
    if (!recognition) { alert("請使用 Chrome 或 Safari 瀏覽器。"); return; }
    if (isListening) {
        try { recognition.stop(); } catch(e) {}
    } else {
        try {
            recognition.lang = 'zh-HK'; recognition.start();
        } catch (e) {
            try {
                recognition.stop();
                setTimeout(function() { recognition.lang = 'zh-HK'; recognition.start(); }, 200);
            } catch(err) {}
        }
    }
}

function checkAnswer(userInput) {
    if (!userInput) return;
    var current = activeQuestions[currentIndex];
    var isCorrect = current.keywords.some(function(key) { return userInput.indexOf(key) !== -1; });
    if (isCorrect) handleSuccess("🎉 答對咗！好棒！");
}

function manualPass() { handleSuccess("👍 家屬確認答對！太棒了！"); }

function handleSuccess(msg) {
    if (hasAnswered) return;
    recordSuccess();
    hasAnswered = true;
    try { recognition.stop(); } catch(e) {}

    var current = activeQuestions[currentIndex];
    document.getElementById('hintBox').innerText = msg;
    speakCantonese("答對咗，呢個係" + current.name);
    setTimeout(function() { nextQuestion(); }, 2200);
}

function giveManualHint() {
    if (activeQuestions.length === 0) return;
    var current = activeQuestions[currentIndex];
    hintLevel++;
    recordCueing();
    if (hintLevel === 1) {
        document.getElementById('hintBox').innerText = "提示：" + current.semantic;
        speakCantonese(current.semantic);
    } else if (hintLevel === 2) {
        document.getElementById('hintBox').innerText = "發音提示：" + current.phonemic;
        speakCantonese(current.phonemic);
    } else {
        document.getElementById('hintBox').innerText = "答案係：" + current.name;
        speakCantonese("呢個就係" + current.name);
    }
}

function nextQuestion() {
    if (activeQuestions.length === 0) return;
    currentIndex = (currentIndex + 1) % activeQuestions.length;
    loadQuestion();
    startClinicalTimer();
}

            <button class="btn-primary" id="m2DistractionBtn" disabled style="opacity: 0.5; cursor: not-allowed;" onclick="m2NextStep()">繼續買餸 ➔</button>
        `;

        var enableDistractionBtn2 = function() {
            var btn = document.getElementById('m2DistractionBtn');
            if (btn) {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        };

        speakCantonese("今日豆腐特價呀，要買趁快！", enableDistractionBtn2);
        setTimeout(enableDistractionBtn2, 4500); // 防卡住機制
    }
    // Step 5: 菜檔2 拼句
    else if (m2Step === 5) {
        speakCantonese("請跟伙記講你想買咩。");
        var blocks = ['唔該', '兩', '個', '一', '斤', '棵', '排', '三', '我要', '薯仔'];
        var validAnswers = ['我要兩個薯仔', '唔該我要兩個薯仔', '我要兩個薯仔唔該'];
        renderSentenceStep("第二關：街市菜檔2 (表達)", blocks, validAnswers, "我要兩個薯仔");
    } 
    // Step 6: 菜檔2 付款 ($15)
    else if (m2Step === 6) {
        if (m2Difficulty === 'hard') {
            renderHardPaymentStep2();
        } else {
            speakCantonese("兩個薯仔呢度15蚊。");
            renderPaymentStep("第二關：街市菜檔2 (付款)", 15, "兩個薯仔，秤咗呢度$15蚊。");
        }
    } 
    // Step 7: 結算通關
    else if (m2Step === 7) {
        speakCantonese("恭喜你！成功買齊材料！今晚有美味嘅番茄薯仔湯飲啦！");
        container.innerHTML = `
            <div style="font-size: 60px; margin: 10px 0;">🥣</div>
            <h2 style="color: #4CAF50; margin-top:0;">恭喜通關！煲湯成功！</h2>
            <div class="m2-task-box" style="text-align: left; background:#eef7ff; border-color:#bbdefb; color:#1565c0;">
                <b>🍲 番茄薯仔湯 材料結算：</b><br>
                • 番茄 2個：<b>$12</b><br>
                • 薯仔 2個：<b>$15</b><br>
                -----------------------------<br>
                <b>💰 總共花費：$27 港幣</b><br>
                <b>🎯 完成難度：${m2Difficulty === 'easy' ? '🟢 初級' : (m2Difficulty === 'medium' ? '🔵 中級' : '🟠 高級 (含找續系統)')}</b>
            </div>
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
                <button class="btn-primary" onclick="startModule2()">🔄 挑戰其他難度</button>
                <button class="btn-next" style="background-color:#607D8B;" onclick="showMainMenu()">🏠 返回主選單</button>
            </div>
        `;
    }

    if (m2Step > 0 && m2Step < 7) {
        startClinicalTimer();
    }
}

function m2SelectSearchItem(isCorrect, name) {
    var fb = document.getElementById('m2Feedback');
    if (isCorrect) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 答對咗！搵到「" + name + "」啦！";
        speakCantonese("答對咗！搵到" + name + "啦！");
        setTimeout(function() {
            m2NextStep();
        }, 1600);
    } else {
        fb.style.color = "#d32f2f";
        fb.innerText = "❌ 呢個係「" + name + "」，再點擊下啦！";
        speakCantonese("呢個係" + name + "，再試下啦");
    }
}

function renderSentenceStep(stepTitle, blocks, validAnswers, hintText) {
    var container = document.getElementById('module2Content');
    
    var blocksHtml = blocks.map(function(b) {
        return `<button class="m2-word-block" onclick="m2AddBlock('${b}')">${b}</button>`;
    }).join('');

    container.innerHTML = `
        <div class="m2-badge">${stepTitle}</div>
        <h3 style="margin:5px 0 10px;">🗣️ 請跟伙記講你想買咩：</h3>
        
        <div class="m2-sentence-box" id="m2SentenceBox">請點擊下方積木...</div>

        <div class="m2-blocks-grid">
            ${blocksHtml}
        </div>

        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <button style="background:#2196F3; color:white; flex:1; font-size:14px; padding:10px;" onclick="m2ShowHint('${hintText}')">💡 提示</button>
            <button style="background:#ff9800; color:white; flex:1; font-size:14px; padding:10px;" onclick="m2ClearBlocks()">🗑️ 重設</button>
            <button style="background:#4CAF50; color:white; flex:1.5; font-size:14px; padding:10px;" onclick="m2CheckSentence(${JSON.stringify(validAnswers).replace(/"/g, '&quot;')})">✅ 確認</button>
        </div>
        <div id="m2SentenceFeedback" class="status" style="margin-top:10px; font-size:15px; font-weight:bold;"></div>
    `;
}

function m2ShowHint(hintText) {
    var fb = document.getElementById('m2SentenceFeedback');
    fb.style.color = "#0056b3";
    fb.innerText = "💡 提示：你可以講「" + hintText + "」";
    speakCantonese("你可以講：" + hintText);
    recordCueing();
}

function m2AddBlock(word) {
    m2SelectedBlocks.push(word);
    var box = document.getElementById('m2SentenceBox');
    box.innerText = m2SelectedBlocks.join(' ');
    speakCantonese(word);
}

function m2ClearBlocks() {
    m2SelectedBlocks = [];
    var box = document.getElementById('m2SentenceBox');
    box.innerText = "請點擊下方積木...";
    document.getElementById('m2SentenceFeedback').innerText = "";
}

function m2CheckSentence(validAnswers) {
    var result = m2SelectedBlocks.join('');
    var fb = document.getElementById('m2SentenceFeedback');
    
    if (validAnswers.indexOf(result) !== -1) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 太棒了！講得好清楚！";
        speakCantonese(m2SelectedBlocks.join('') + "。講得好棒！");
        setTimeout(function() {
            m2NextStep();
        }, 1800);
    } else {
        fb.style.color = "#d32f2f";
        fb.innerText = "未啱喎，請重新試下拼句。";
        speakCantonese("未啱喎，再試一下");
    }
}

/* 初級/中級：精準投幣付款 */
function renderPaymentStep(stepTitle, targetAmount, vendorSpeech) {
    var container = document.getElementById('module2Content');

    container.innerHTML = `
        <div class="m2-badge">${stepTitle}</div>
        <div class="m2-vendor-say">🗣️ 伙計：「${vendorSpeech}」</div>

        <div class="m2-pay-board">
            <div>目標金額：<span style="color:#d32f2f; font-size:24px; font-weight:bold;">$${targetAmount}</span></div>
            <div style="margin-top:5px;">目前已付：<span id="m2PaidText" style="color:#2e7d32; font-size:24px; font-weight:bold;">$0</span></div>
        </div>

        <div style="font-size:14px; font-weight:bold; color:#555;">點擊港幣硬幣進行付款：</div>
        
        <div class="m2-coins-row">
            <div class="hk-coin coin-hk10" onclick="m2AddCoin(10, ${targetAmount})">$10</div>
            <div class="hk-coin coin-hk5" onclick="m2AddCoin(5, ${targetAmount})">$5</div>
            <div class="hk-coin coin-hk2" onclick="m2AddCoin(2, ${targetAmount})">$2</div>
            <div class="hk-coin coin-hk1" onclick="m2AddCoin(1, ${targetAmount})">$1</div>
        </div>

        <button style="background:#9e9e9e; color:white; padding:8px 16px; margin-top:5px; font-size:14px; border-radius:20px;" onclick="m2ResetCoins(${targetAmount})">🔄 清除金額重新投幣</button>
        <div id="m2PayFeedback" class="status" style="margin-top:10px; font-size:16px; font-weight:bold;"></div>
    `;
}

function m2AddCoin(amount, target) {
    m2PaidAmount += amount;
    document.getElementById('m2PaidText').innerText = "$" + m2PaidAmount;
    speakCantonese(amount + "蚊");

    var fb = document.getElementById('m2PayFeedback');
    if (m2PaidAmount === target) {
        recordSuccess();
        fb.style.color = "#2e7d32";
        fb.innerText = "🎉 付款成功！啱啱好 $" + target + " 蚊！";
        speakCantonese("收你" + target + "蚊，啱啱好！多謝！");
        setTimeout(function() {
            m2NextStep();
        }, 2000);
    } else if (m2PaidAmount > target) {
        fb.style.color = "#d32f2f";
        fb.innerText = "⚠️ 俾多咗錢啦 ($" + m2PaidAmount + " 蚊)，幫你重新投幣！";
        speakCantonese("俾多咗錢啦，請重新投幣");
        setTimeout(function() {
            m2ResetCoins(target);
        }, 1500);
    }
}

function m2ResetCoins(target) {
    m2PaidAmount = 0;
    var el = document.getElementById('m2PaidText');
    if (el) el.innerText = "$0";
    var fb = document.getElementById('m2PayFeedback');
    if (fb) fb.innerText = "";
}

/* 高級：$50 找續系統 關卡 1 (番茄 $12) */

            <div class="m2-badge">高級：街市菜檔1 (付款)</div>
            <div class="m2-vendor-say">🗣️ 伙計：「番茄，秤咗呢度$12蚊。」</div>

        `;

        speakCantonese("收你50蚊，心算時間：50減12，應該找返幾多錢？");
        container.innerHTML = `
            <div class="m2-badge">高級：餘額心算測驗 (Mental Math)</div>
            <div class="m2-pay-board">

                <button class="m2-word-block" style="background:#4CAF50; padding:15px 25px;" onclick="checkHardMath(38)">$38</button>

        `;

        speakCantonese("檔販找返：1張20蚊、1張10蚊、同埋4個2蚊，請點算確認是否正確。");
        container.innerHTML = `
            <div class="m2-badge">高級：找續驗證 (Change Verification)</div>
            <div class="m2-vendor-say">🗣️ 檔販找返找續：</div>
            
            <div style="background:#fff; border:2px dashed #4CAF50; border-radius:15px; padding:12px; margin-bottom:15px;">
                <div style="font-size:14px; color:#555; margin-bottom:8px;">點算檔販遞出嘅錢：</div>
                <div style="display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span class="hk-note note-20" style="cursor:default; width:80px; height:40px; font-size:15px;">$20</span>
                    <span class="hk-note note-10" style="cursor:default; width:80px; height:40px; font-size:15px;">$10</span>
                    <span class="hk-coin coin-hk2" style="cursor:default; width:42px; height:42px; font-size:12px;">$2</span>
                    <span class="hk-coin coin-hk2" style="cursor:default; width:42px; height:42px; font-size:12px;">$2</span>
                    <span class="hk-coin coin-hk2" style="cursor:default; width:42px; height:42px; font-size:12px;">$2</span>
                    <span class="hk-coin coin-hk2" style="cursor:default; width:42px; height:42px; font-size:12px;">$2</span>
                </div>
                <div style="margin-top:10px; font-weight:bold; color:#2e7d32;">（$20 + $10 + $8 = $38 港幣）</div>
            </div>

            <button class="btn-primary" onclick="confirmHardChange1()">✅ 點算正確，收取找續 ➔</button>
        `;
    }
}

function m2HardPay50() {
    speakCantonese("付了50蚊");
    m2SubStep = 1;
    renderHardPaymentStep1();
}

function checkHardMath(ans) {
    var fb = document.getElementById('m2HardFB');
    if (ans === 38) {
        recordSuccess();
        speakCantonese("心算正確！找38蚊！");
        m2SubStep = 2;
        renderHardPaymentStep1();
    } else {
        recordCueing();
        fb.style.color = "#d32f2f";
        fb.innerText = "❌ 算錯了，再試一下：$50 - $12 = ？";
        speakCantonese("算錯了，再試一下");
    }
}

function confirmHardChange1() {
    recordSuccess();
    speakCantonese("收妥找續，錢包更新。");
    m2NextStep();
}

function m2HardPay20() {

}

function warnInsufficientPay() {

function confirmHardChange2() {

    speakCantonese("付款完成！");

}
